name: Verify and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: patch-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Identify the patch-work production deployment (read-only)
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CONVEX_DEPLOY_KEY" \
            --header "Convex-Client: npm-cli-1.28.0" \
            https://api.convex.dev/api/teams/david-imafidon/projects/patch-work/deployments)"
          production_name="$(jq --raw-output '.[] | select(.deployment_type == "prod") | .name' <<<"$response")"
          if [[ -z "$production_name" || "$production_name" == "null" ]]; then
            echo "::error::Convex did not return the patch-work production deployment name."
            exit 1
          fi
          echo "patch-work production deployment: $production_name"
      - name: Verify the deploy key targets patch-work production
        run: |
          output="$(npx convex deploy --dry-run --typecheck=disable 2>&1)"
          printf '%s\n' "$output"
          if ! grep -Eq '^\[Production\].*:patch-work:(prod|production)(/|$)' <<<"$output"; then
            echo "::error::CONVEX_DEPLOY_KEY must belong to the production deployment of the patch-work project."
            exit 1
          fi
          deployment_url="$(grep -Eo 'https://[a-z0-9-]+\.convex\.cloud' <<<"$output" | head -n 1)"
          if [[ -z "$deployment_url" ]]; then
            echo "::error::Could not determine the patch-work production Convex URL from the dry run."
            exit 1
          fi
          echo "VITE_CONVEX_URL=$deployment_url" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run embed:static
      - run: npx convex deploy --typecheck=enable --message "GitHub Actions production deploy $GITHUB_SHA"
