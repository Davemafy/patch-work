name: Verify and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: patch-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      VITE_CONVEX_URL: https://aware-porpoise-430.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run embed:static
      - name: Verify the Convex deployment target
        run: |
          output="$(npx convex deploy --dry-run --typecheck=disable 2>&1)"
          printf '%s\n' "$output"
          if ! grep -q "aware-porpoise-430" <<<"$output"; then
            echo "::error::The deploy key is not associated with aware-porpoise-430."
            exit 1
          fi
      - run: npx convex deploy --typecheck=enable --message "GitHub Actions production deploy $GITHUB_SHA"
