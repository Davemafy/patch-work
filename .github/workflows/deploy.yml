name: Verify and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: patch-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      VITE_CONVEX_URL: https://aware-porpoise-430.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require a production Convex deploy key
        run: |
          if [[ "$CONVEX_DEPLOY_KEY" != prod:* ]]; then
            echo "::error::CONVEX_DEPLOY_KEY must be the production deploy key for aware-porpoise-430."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run embed:static
      - run: npx convex deploy --typecheck=enable --message "GitHub Actions production deploy $GITHUB_SHA"
